services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kazipay
      POSTGRES_USER: kazipay_owner
      POSTGRES_PASSWORD: kazipay_owner
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kazipay
      MINIO_ROOT_PASSWORD: kazipay-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

    

volumes:
  postgres-data:
  minio-data: